plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.trycandid.reactnative'
// Single-sourced from package.json so the module version cannot drift from the npm version.
version = new groovy.json.JsonSlurper().parse(file('../package.json')).version

android {
  namespace "com.trycandid.reactnative"
  defaultConfig {
    versionCode 1
    versionName project.version.toString()
  }
  lintOptions {
    abortOnError false
  }
}
